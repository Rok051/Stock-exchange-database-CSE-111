<!DOCTYPE html>
<html>

<head>
    <title>Test Watchlist</title>
</head>

<body>
    <h1>Watchlist Creation Test</h1>
    <button onclick="testCreate()">Create Test Watchlist</button>
    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:5001/api';
        let authToken = null;

        // Login first
        async function login() {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: 'rohit@example.com',
                    password: 'demo123'
                })
            });
            const data = await response.json();
            authToken = data.token;
            console.log('Logged in as:', data.user.full_name);
            return data.user;
        }

        async function testCreate() {
            if (!authToken) {
                await login();
            }

            const watchlistName = prompt('Enter watchlist name:');
            if (!watchlistName) return;

            const response = await fetch(`${API_BASE}/watchlists`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ name: watchlistName })
            });

            const result = await response.json();
            document.getElementById('result').innerHTML =
                `<pre>Status: ${response.status}\n${JSON.stringify(result, null, 2)}</pre>`;
        }

        // Auto-login on page load
        login();
    </script>
</body>

</html>
